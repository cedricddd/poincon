services:
  db:
    image: postgres:15-alpine
    container_name: poincon-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-poincon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poincon_dev_password}
      POSTGRES_DB: ${DB_NAME:-poincon}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poincon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:20-alpine
    container_name: poincon-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://poincon:poincon_dev_password@db:5432/poincon
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-in-production-do-not-share
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-change-in-production}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-noreply@example.com}
    ports:
      - "3000:3000"
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
    environment:
      DATABASE_URL: postgresql://poincon:poincon_dev_password@db:5432/poincon
    command: sh -c "apk add --no-cache openssl && npm install prisma@5.22.0 --no-save && npx prisma migrate dev --name init"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data_dev:
    driver: local
  app_node_modules:
    driver: local
