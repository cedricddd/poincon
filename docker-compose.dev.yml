services:
  db:
    image: postgres:15-alpine
    container_name: pointon-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-pointon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pointon_dev_password}
      POSTGRES_DB: ${DB_NAME:-pointon}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pointon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:20-alpine
    container_name: pointon-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://${DB_USER:-poincon}:${DB_PASSWORD:-poincon_dev_password}@db:5432/${DB_NAME:-poincon}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production-do-not-share}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-change-in-production}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-noreply@example.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_PRICE_SOLO_MONTHLY: ${STRIPE_PRICE_SOLO_MONTHLY:-}
      STRIPE_PRICE_SOLO_YEARLY: ${STRIPE_PRICE_SOLO_YEARLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_YEARLY: ${STRIPE_PRICE_ENTERPRISE_YEARLY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_dummy}
    ports:
      - "3000:3000"
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
    environment:
      DATABASE_URL: postgresql://${DB_USER:-poincon}:${DB_PASSWORD:-poincon_dev_password}@db:5432/${DB_NAME:-poincon}
    command: sh -c "apk add --no-cache openssl && npm install prisma@5.22.0 --no-save && npx prisma migrate dev --name init"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data_dev:
    driver: local
  app_node_modules:
    driver: local
