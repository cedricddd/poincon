            - generic [ref=e41]: BE
            - generic [ref=e42]:
              - heading "CCT n°129 — Enregistrement du temps de travail" [level=3] [ref=e43]
              - paragraph [ref=e44]: La Convention Collective de Travail n°129 du Conseil National du Travail (CNT) impose depuis 2023 l'enregistrement électronique du temps de travail pour certains secteurs. La généralisation à toutes les entreprises belges est prévue progressivement jusqu'en 2027. Pointon répond à toutes les exigences techniques de cette CCT.
          - generic [ref=e46]:
            - generic [ref=e48]: EU
            - generic [ref=e49]:
              - heading "Arrêt CJUE C-55/18 (2019) — Deutsche Bank" [level=3] [ref=e50]
              - paragraph [ref=e51]: "La Cour de Justice de l'Union Européenne a établi en 2019 que les employeurs sont tenus de mettre en place un système objectif, fiable et accessible permettant de mesurer la durée du temps de travail journalier effectué par chaque travailleur. Pointon fournit exactement ce système : enregistrement automatique, immuable et exportable."
          - generic [ref=e53]:
            - generic [ref=e55]: RGPD
