              - paragraph [ref=e58]: Les données de pointage sont des données personnelles au sens du RGPD. Pointon traite ces données avec les bases légales appropriées (obligation légale pour le temps de travail, contrat pour la gestion des comptes), dans le respect des principes de minimisation, limitation de conservation et sécurité des données.
