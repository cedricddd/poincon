            - generic [ref=e138]:
              - generic [ref=e139]:
                - text: 🚀 FreeKiosk - L'alternative gratuite au navigateur kiosque
                - text: FreeKiosk est une application kiosque entièrement gratuite et open source pour tablettes Android. Idéale pour l'affichage dynamique, les tableaux de bord et les écrans verrouillés.
                - text: Développée par Rushb, une entreprise technologique française passionnée par la création de solutions open source innovantes.
                - text: ✨ FONCTIONNALITÉS PRINCIPALES
                - text: • Mode Kiosque complet avec prise en charge du propriétaire de l'appareil
                - text: • WebView pour toutes les URL (tableaux de bord, sites web, applications)
                - text: • Protection par code PIN (4 à 6 chiffres)
                - text: • Démarrage automatique au démarrage de l'appareil
                - text: • Plein écran immersif (sans barre de navigation ni d'état)
                - text: • Blocage des pop-ups Samsung (mode propriétaire de l'appareil)
                - text: • Suspension des applications système
                - text: • 100 % gratuit - Sans publicité, sans abonnement
                - text: • Open source (licence MIT)
                - text: 📱 IDÉAL POUR
                - text: • Tableaux de bord Home Assistant
                - text: • Affichage numérique
                - text: • Menus numériques de restaurants
                - text: • Bornes d'information d'hôtels
                - text: • Affichages en point de vente
                - text: • Expositions interactives de musées
                - text: • Bornes d'enregistrement pour événements
                - text: • Affichages dans les halls d'entreprise
                - text: 🔒 MODE PROPRIÉTAIRE DE L'APPAREIL
                - text: "Pour un verrouillage complet, FreeKiosk prend en charge le mode propriétaire de l'appareil Android :"
                - text: • Contrôle total de l'appareil
                - text: • Blocage de toutes les interruptions du système
                - text: • Désactivation des boutons d'accueil et des applications récentes
                - text: • Masquer les notifications
                - text: • Empêcher la désinstallation des applications
                - text: • ADB unique Installation (sans root)
                - text: Guide d'installation complet inclus dans l'application et sur freekiosk.app
                - text: 🆚 POURQUOI FREEKIOSK ?
                - text: "Comparé à Fully Kiosk Browser :"
                - text: "✅ 100 % gratuit (Fully : 7,90 €/appareil)"
                - text: "✅ Open source MIT (Fully : code source fermé)"
                - text: ✅ Sans suivi, sans publicité
                - text: ✅ Développement communautaire
                - text: ✅ Mêmes fonctionnalités pour les utilisateurs d'appareils identiques
                - text: 🛠️ TECHNIQUE
                - text: • Compatible avec Android 8.0 et versions ultérieures
                - text: • Léger (environ 30 Mo)
                - text: • Fonctionnement hors ligne
                - text: • Aucune collecte de données
                - text: • Architecture React Native + Kotlin
                - text: 📖 OPEN SOURCE
                - text: FreeKiosk est entièrement open source sous licence MIT. Consultez le code source, contribuez ou signalez des problèmes sur GitHub.
                - text: 🌐 LIENS
                - text: "Site web : freekiosk.app"
                - text: "GitHub : github.com/rushb/freekiosk"
                - text: "Assistance : support@freekiosk.app"
                - text: "Documentation : freekiosk.app/docs"
                - text: 🏢 À PROPOS DE RUSHB
                - text: Rushb est une entreprise technologique française spécialisée dans les solutions logicielles open source innovantes. FreeKiosk est notre premier grand projet open source, et d'autres suivront !
                - text: 📋 DÉMARRER
                - text: 1. Installer FreeKiosk
                - text: 2. Configurer votre URL
                - text: 3. Définir un code PIN
                - text: 4. Démarrer le mode kiosque
                - text: 5. (Facultatif) Activer le mode propriétaire de l'appareil pour un verrouillage complet
                - text: Guide d'installation complet inclus.
                - text: 💬 COMMUNAUTÉ
                - text: "Rejoignez notre communauté grandissante :"
                - text: • Signalez des bugs sur GitHub
                - text: • Demandez des fonctionnalités
                - text: • Contribuez au code
                - text: • Traduisez dans votre langue
                - text: • Partagez votre cas d'utilisation
                - text: 🔮 FEUILLE DE ROUTE
                - text: "Prochainement :"
                - text: • Support multilingue (FR, DE, ES, etc.)
                - text: • Thème en mode sombre
                - text: • Rotation d'URL multiples
                - text: • Détection de mouvement
                - text: • Programmation automatique de la luminosité
                - text: • FreeKiosk Cloud (tableau de bord MDM)
                - text: 📄 AUTORISATIONS
                - text: "FreeKiosk requiert des autorisations minimales :"
                - text: "• Internet : Pour afficher du contenu web"
                - text: "• Démarrage : Pour démarrer automatiquement"
                - text: "• Administrateur de l'appareil : Pour le mode propriétaire de l'appareil (facultatif)"
                - text: Aucun accès à la localisation, à la caméra ou aux données personnelles requis.
                - text: 🙏 SOUTENEZ LE PROJET
                - text: "FreeKiosk est gratuit pour toujours. Soutenez-nous :"
                - text: • ⭐ Donnez-nous 5 étoiles
                - text: • 💬 Laissez un avis
                - text: • 🔗 Partagez
                - text: • 🐛 Signalez des bugs
                - text: • 💻 Contribuez au code
                - text: "---"
                - text: Fabriqué avec ❤️ en France par Rushb
                - text: Gratuit pour toujours • Open source • Respect de la vie privée
                - text: freekiosk.app
