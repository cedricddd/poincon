name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Prisma schema change
        id: schema
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx 'prisma/schema.prisma'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull and rebuild app on LXC 106
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            pct exec 106 -- bash -c 'cd /opt/pointon && git pull origin main && docker compose up -d --build app'

      # Non-destructive by design: no --accept-data-loss. If the push would
      # drop data, this step fails and the migration must be applied manually.
      - name: Apply Prisma schema (db push)
        if: steps.schema.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            pct exec 106 -- bash -c 'cd /opt/pointon && docker compose run --rm app sh -c "npx prisma@5.22.0 db push"'

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://pointon.be/fr | grep -iq pointon
          echo "pointon.be is up and serving content"
