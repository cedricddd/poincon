name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Prisma schema change
        id: schema
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx 'prisma/schema.prisma'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Order matters: pull, then apply the schema, then rebuild. The running app
      # keeps serving while the schema changes (additive changes are safe for the
      # old code); if the schema step fails, the job stops before the rebuild, so
      # production never runs new code against a database without its columns.
      - name: Pull code on LXC 106
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            pct exec 106 -- bash -c 'cd /opt/pointon && git pull origin main'

      # Non-destructive by design: no --accept-data-loss. If Prisma warns (data loss,
      # or a new unique constraint), this step fails, the old app keeps running and
      # the schema must be applied by hand (command in CLAUDE.md), then re-run the job.
      # The pulled schema is mounted read-only into the current image.
      - name: Apply Prisma schema (db push)
        if: steps.schema.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            pct exec 106 -- bash -c 'cd /opt/pointon && docker compose run --rm -v /opt/pointon/prisma:/app/prisma:ro app sh -c "npx prisma@5.22.0 db push --skip-generate"'

      - name: Rebuild app and cron on LXC 106
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            pct exec 106 -- bash -c 'cd /opt/pointon && docker compose up -d --build app && docker compose up -d cron'

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://pointon.be/fr | grep -iq pointon
          echo "pointon.be is up and serving content"
